name: Set up Flutter
description: Installs the Flutter version pubspec.lock was resolved with.

runs:
  using: composite
  steps:
    # The version pubspec.lock was resolved with; bump it together.
    - uses: subosito/flutter-action@v2
      with:
        channel: stable
        flutter-version: 3.47.7
        cache: true
        pub-cache: true
