name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # The version pubspec.lock was resolved with; bump it together.
          flutter-version: 3.47.7
          cache: true
          pub-cache: true

      - name: Install Linux native build dependencies
        if: runner.os == 'Linux'
        # The cnativeapi native-asset build, which `flutter test` runs, links
        # GTK 3 and X11 through pkg-config.
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxi-dev libx11-dev

      - name: Get dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
