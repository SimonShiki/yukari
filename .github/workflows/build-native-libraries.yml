name: Build Native Libraries

on:
  workflow_dispatch:
  push:
    paths:
      - 'xmake.lua'
      - '.github/workflows/build-native-libraries.yml'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            arch: x64
            runner: windows-latest
            library: easytier_ffi.dll
            rust_targets: x86_64-pc-windows-msvc

          - platform: linux
            arch: x86_64
            runner: ubuntu-latest
            library: libeasytier_ffi.so
            rust_targets: x86_64-unknown-linux-gnu

          - platform: android
            arch: arm64-v8a
            runner: ubuntu-latest
            library: libeasytier_ffi.so
            rust_targets: aarch64-linux-android
            ndk_version: r26d

          - platform: android
            arch: x86_64
            runner: ubuntu-latest
            library: libeasytier_ffi.so
            rust_targets: x86_64-linux-android
            ndk_version: r26d

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          targets: ${{ matrix.rust_targets }}

      - name: Install LLVM and Clang
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-18 clang-18 libclang-18-dev
          sudo ln -sf /usr/bin/clang-18 /usr/bin/clang
          sudo ln -sf /usr/bin/clang++-18 /usr/bin/clang++

      - name: Install cross-compilation toolchain
        if: matrix.apt_packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt_packages }}

      - name: Setup Android NDK
        if: matrix.ndk_version
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ matrix.ndk_version }}
        id: setup-ndk

      - name: Configure xmake (Windows)
        if: runner.os == 'Windows'
        run: xmake f -p ${{ matrix.platform }} -a ${{ matrix.arch }} -m release -y
        shell: cmd

      - name: Configure xmake (Linux/Android)
        if: runner.os != 'Windows'
        run: |
          args="-p ${{ matrix.platform }} -a ${{ matrix.arch }} -m release -y"
          if [ -n "${{ matrix.cross }}" ]; then
            args="$args --cross=${{ matrix.cross }}"
          fi
          if [ -n "${{ matrix.ndk_version }}" ]; then
            args="$args --ndk=${{ steps.setup-ndk.outputs.ndk-path }}"
          fi
          xmake f $args
        shell: bash
        env:
          LLVM_ROOT: /usr/lib/llvm-18

      - name: Build with xmake
        run: xmake -r
        env:
          LIBCLANG_PATH: ${{ runner.os == 'Linux' && '/usr/lib/llvm-18/lib' || '' }}

      - name: Verify build output
        run: |
          ls -lah build/${{ matrix.platform }}/${{ matrix.arch }}/release/
          test -f build/${{ matrix.platform }}/${{ matrix.arch }}/release/${{ matrix.library }}
        shell: bash

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.library }}
          path: build/${{ matrix.platform }}/${{ matrix.arch }}/release/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded artifacts
        run: |
          echo "Downloaded artifacts:"
          find artifacts -type f

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: natives
          name: Native Libraries
          body: Prebuilt easytier FFI libraries for all supported platforms
          files: |
            artifacts/**/*.dll
            artifacts/**/*.so
            artifacts/**/*.sys
          fail_on_unmatched_files: true
          make_latest: false
