name: Build Native Libraries

on:
  workflow_dispatch:
  push:
    paths:
      - 'xmake.lua'
      - '.github/workflows/build-native-libraries.yml'

jobs:
  build:
    strategy:
      matrix:
        include:
          - platform: windows
            arch: x64
            runner: windows-latest
            library: easytier_ffi.dll
            rust_targets: x86_64-pc-windows-msvc

          - platform: linux
            arch: x86_64
            runner: ubuntu-latest
            library: libeasytier_ffi.so
            rust_targets: x86_64-unknown-linux-gnu

          - platform: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            library: libeasytier_ffi.so
            rust_targets: aarch64-unknown-linux-gnu

          - platform: android
            arch: arm64-v8a
            runner: ubuntu-latest
            library: libeasytier_ffi.so
            rust_targets: aarch64-linux-android
            ndk_version: r26d

          - platform: android
            arch: x86_64
            runner: ubuntu-latest
            library: libeasytier_ffi.so
            rust_targets: x86_64-linux-android
            ndk_version: r26d

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          targets: ${{ matrix.rust_targets }}

      - name: Install LLVM and Clang
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-18 clang-18 libclang-18-dev
          sudo ln -sf /usr/bin/clang-18 /usr/bin/clang
          sudo ln -sf /usr/bin/clang++-18 /usr/bin/clang++

      - name: Setup Android NDK
        if: matrix.ndk_version
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ matrix.ndk_version }}
        id: setup-ndk

      - name: Configure xmake (Windows)
        if: runner.os == 'Windows'
        run: xmake f -p ${{ matrix.platform }} -a ${{ matrix.arch }} -m release -y
        shell: cmd

      - name: Configure xmake (Linux/Android)
        if: runner.os != 'Windows'
        run: |
          args="-p ${{ matrix.platform }} -a ${{ matrix.arch }} -m release -y"
          if [ -n "${{ matrix.ndk_version }}" ]; then
            args="$args --ndk=${{ steps.setup-ndk.outputs.ndk-path }}"
          fi
          xmake f $args
        shell: bash
        env:
          LLVM_ROOT: /usr/lib/llvm-18

      - name: Build with xmake
        run: xmake -r
        env:
          LIBCLANG_PATH: ${{ runner.os == 'Linux' && '/usr/lib/llvm-18/lib' || '' }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.library }}
          path: build/${{ matrix.platform }}/${{ matrix.arch }}/release/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts


      - name: Upload Windows x64 library
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: artifacts/windows-x64-easytier_ffi.dll/easytier_ffi.dll
          asset_name: windows-x64-easytier_ffi.dll
          tag: natives
          release_name: Native Libraries
          overwrite: true
          prerelease: true
          make_latest: false

      - name: Upload Linux x86_64 library
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: artifacts/linux-x86_64-libeasytier_ffi.so/libeasytier_ffi.so
          asset_name: linux-x86_64-libeasytier_ffi.so
          tag: natives
          release_name: Native Libraries
          overwrite: true
          prerelease: true
          make_latest: false

      - name: Upload Linux arm64 library
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: artifacts/linux-arm64-libeasytier_ffi.so/libeasytier_ffi.so
          asset_name: linux-arm64-libeasytier_ffi.so
          tag: natives
          release_name: Native Libraries
          overwrite: true
          prerelease: true
          make_latest: false

      - name: Upload Android arm64-v8a library
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: artifacts/android-arm64-v8a-libeasytier_ffi.so/libeasytier_ffi.so
          asset_name: android-arm64-v8a-libeasytier_ffi.so
          tag: natives
          release_name: Native Libraries
          overwrite: true
          prerelease: true
          make_latest: false

      - name: Upload Android x86_64 library
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: artifacts/android-x86_64-libeasytier_ffi.so/libeasytier_ffi.so
          asset_name: android-x86_64-libeasytier_ffi.so
          tag: natives
          release_name: Native Libraries
          overwrite: true
          prerelease: true
          make_latest: false

      - name: Upload Windows Packet.dll
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: artifacts/windows-x64-easytier_ffi.dll/Packet.dll
          asset_name: Packet.dll
          tag: natives
          release_name: Native Libraries
          overwrite: true
          prerelease: true
          make_latest: false

      - name: Upload Windows wintun.dll
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: artifacts/windows-x64-easytier_ffi.dll/wintun.dll
          asset_name: wintun.dll
          tag: natives
          release_name: Native Libraries
          overwrite: true
          prerelease: true
          make_latest: false

      - name: Upload Windows WinDivert64.sys
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: artifacts/windows-x64-easytier_ffi.dll/WinDivert64.sys
          asset_name: WinDivert64.sys
          tag: natives
          release_name: Native Libraries
          overwrite: true
          prerelease: true
          make_latest: false
