name: Build Service Module

on:
  workflow_dispatch:
  push:
    branches: [trunk]
    paths:
      - 'bin/**'
      - 'lib/**'
      - 'hook/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'tool/service_module/**'
      - 'tool/pack_service_module.sh'
      - '.github/workflows/service-module.yml'
  # New EasyTier libraries change what the module bundles.
  workflow_run:
    workflows: [Build Native Libraries]
    types: [completed]
    branches: [trunk]

jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    # The bundled glibc must be at least as new as the one the EasyTier
    # libraries were built against; see build-native-libraries.yml.
    runs-on: ubuntu-26.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install the arm64 glibc
        run: |
          sudo apt-get update
          sudo apt-get install -y libc6-arm64-cross libgcc-s1-arm64-cross zip

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Pack the service module
        run: tool/pack_service_module.sh build/yukari-service-module.zip

      - name: Upload the service module
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: build/yukari-service-module.zip
          asset_name: yukari-service-module.zip
          tag: ksu-service-module
          release_name: Service Module
          overwrite: true
          prerelease: true
          make_latest: false
