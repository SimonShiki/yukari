org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Avoid Kotlin incremental cache path failures when the Pub cache and project are on different drives.
kotlin.incremental=false
# Explicit opt-in so Flutter 3.50's Gradle migrator does not re-add =false.
android.builtInKotlin=true
android.newDsl=true
